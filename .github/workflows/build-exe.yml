# 自动构建 Windows 可执行文件（绿色版，非安装包）
# 触发：打 v* 开头的 tag（如 v0.1.0），或手动运行（Actions 页面 Run workflow）
# 产物：token-usage-widget.exe（前端资源已嵌入，双击即可运行，依赖系统 WebView2）
# 发布：打 tag 时自动创建 GitHub Release 草稿，附上 exe
# 发布说明：优先使用仓库内本地写好的 notes/<tag>.md（如 notes/v0.1.0.md，需随 tag 一起提交）；
#           若该文件不存在，则自动汇总上次 tag 以来的 commit 标题作为兜底

name: Build Windows exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release exe
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      # ---- 发布说明：本地 notes/<tag>.md 优先，缺失则自动生成 ----
      # 注意：以下「解析 tag / 重命名产物 / 检查说明」三步只在 tag 触发时执行。
      # 手动在分支上跑（用于预热缓存）时 GITHUB_REF 是 refs/heads/xxx，
      # 若不加守卫，${GITHUB_REF#refs/tags/} 剥不掉前缀，产物名会变成带斜杠的
      # token-usage-widget-refs/heads/xxx.exe，mv 因目录不存在而失败 → 整个 job 失败
      # → 缓存也不会被保存（actions/cache 只在 job 成功时保存）。
      - name: 解析当前 tag 名称
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # 给 exe 加上版本号后缀，避免不同 release 产物重名
      - name: 重命名 exe 产物
        id: artifact
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          src="src-tauri/target/release/token-usage-widget.exe"
          dst="token-usage-widget-${{ steps.tag.outputs.tag }}.exe"
          mv "$src" "$dst"
          echo "path=$dst" >> "$GITHUB_OUTPUT"

      - name: 检查本地发布说明文件是否存在
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ -f "notes/${{ steps.tag.outputs.tag }}.md" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release（使用本地发布说明）
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          body_path: notes/${{ steps.tag.outputs.tag }}.md
          draft: true

      - name: Publish GitHub Release（自动生成发布说明）
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true
          draft: true
