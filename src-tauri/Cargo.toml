[package]
name = "token-usage-widget"
version = "0.1.0"
description = "Token 用量监控悬浮小组件（Rust + Tauri 重写版）"
authors = ["张海涛"]
edition = "2021"

[lib]
name = "token_usage_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
chrono = "0.4"
dirs = "5"
regex = "1"
rand = "0.8"
thiserror = "2"
notify = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
zstd = "0.13"
once_cell = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
strip = true
lto = true
